spring:
  application:
    name: skala-shop-api

  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: none
      embedding:
        text: none
    vectorstore:
      type: none
    google:
      genai:
        embedding:
          api-key: disabled

app:
  ai:
    enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:U0tBTEEtU0hPUC1KV1QtU0VDUkVULUtFWS0yMDI2LUtFRVAtVEhJUy1TQUZFISE=}
  expiration-minutes: 60
